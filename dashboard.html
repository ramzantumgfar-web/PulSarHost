<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PulSar Host Panel</title>

<link rel="stylesheet" href="style.css">
</head>


<body>


<div class="dashboard">


<aside class="sidebar">

<h2>
🚀 PulSar
</h2>

<a>🏠 Главная</a>
<a>🖥 Серверы</a>
<a>📁 Файлы</a>
<a>⚙ Настройки</a>
<a>💳 Баланс</a>
<a>🛡 Защита</a>


</aside>




<main class="content">


<header class="topbar">

<h1>
Панель управления
</h1>


<div class="user">
👤 Пользователь
</div>


</header>




<section class="cards">


<div class="card">

<h3>
💎 Баланс
</h3>

<h2>
0.00 ₽
</h2>

<button>
Пополнить
</button>

</div>



<div class="card">

<h3>
🖥 Серверов
</h3>

<h2>
1
</h2>

<p>
Активных серверов
</p>

</div>



<div class="card">

<h3>
⚡ Статус
</h3>

<h2>
🟢 Онлайн
</h2>

</div>


</section>





<section class="server">


<div class="server-title">

<h2>
🎮 GTA RP Server
</h2>


<span>
🟢 Работает
</span>


</div>




<div class="stats">


<div>
CPU
<br>
15%
</div>


<div>
RAM
<br>
4GB
</div>


<div>
Игроки
<br>
0/100
</div>


</div>




<div class="buttons">


<button>
▶ Запустить
</button>


<button>
⏹ Остановить
</button>


<button>
🔄 Перезапуск
</button>


<button>
⚙ Настройки
</button>


</div>


</section>






<section class="tools">


<div>
📁 Файловый менеджер
</div>


<div>
💻 Консоль
</div>


<div>
📈 Аналитика
</div>


<div>
🛡 Anti-DDoS
</div>


</section>



</main>


</div>


</body>

</html>
